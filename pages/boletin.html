<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletín semanal · BecaMax</title>
  <meta name="robots" content="noindex">
  <!-- Aquí llegan los enlaces de los correos del boletín (confirmar y darse
       de baja): el backend redirige con ?estado=… y esta página lo explica.
       Es pública (tests/navegacion.test.js): se abre desde el correo. -->
  <link rel="icon" type="image/png" href="/img/logo.png">
  <script src="/js/error-reporter.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<script>if(localStorage.getItem('theme')==='light'){document.documentElement.classList.add('light-mode');document.body.classList.add('light-mode');}</script>
<a href="#main-content" class="skip-link">Saltar al contenido principal</a>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo">
      <img src="/img/logo.png" alt="BecaMax" class="logo-img" style="height:32px;width:32px;border-radius:6px;object-fit:cover;">
      <span class="logo-text font-heading">BecaMax</span>
    </a>
  </div>
</header>

<main id="main-content" style="max-width:640px;margin:80px auto;padding:0 24px 80px;">
  <div class="auth-card" style="max-width:100%;text-align:center;">
    <span style="background:rgba(16,185,129,.1);color:var(--primary);font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:50px;text-transform:uppercase;letter-spacing:1px;">Boletín semanal</span>
    <h1 class="font-heading" id="boletinTitulo" style="font-size:2rem;margin-top:16px;margin-bottom:12px;">Boletín de BecaMax</h1>
    <p id="boletinTexto" style="color:var(--text-secondary);line-height:1.7;margin-bottom:32px;">
      Cada lunes, las becas nuevas de la semana y las que cierran pronto.
    </p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
      <a href="/" class="btn btn-primary">Buscar becas</a>
      <a href="/#boletin" class="btn btn-secondary" id="boletinOtraVez" hidden>Suscribirme otra vez</a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">Beca<span>Max</span></div>
    <nav class="footer-links">
      <a href="/">Inicio</a>
      <a href="/pages/legal/privacidad">Privacidad</a>
      <a href="/pages/legal/aviso-legal">Aviso legal</a>
    </nav>
  </div>
  <div class="footer-copy">© 2026 Francisco Javier Párraga Oliver · Todos los derechos reservados</div>
</footer>

<script>
  (function () {
    var MENSAJES = {
      confirmado: ['¡Suscripción confirmada!', 'Desde el próximo lunes recibirás las becas nuevas de la semana y las que cierran pronto. Cada correo trae un enlace para darte de baja con un clic.'],
      caducado: ['El enlace ha caducado', 'Los enlaces de confirmación duran 48 horas. Vuelve a suscribirte y te mandamos otro.', true],
      invalido: ['Este enlace ya no es válido', 'Puede que ya lo hayas usado o que esté incompleto. Si quieres el boletín, vuelve a suscribirte.', true],
      baja: ['Te has dado de baja', 'No te volveremos a escribir y hemos borrado tu email. Si ha sido sin querer, puedes volver a suscribirte cuando quieras.', true],
      error: ['Algo ha fallado', 'No hemos podido completarlo. Prueba otra vez en unos minutos; ya nos ha llegado el aviso del fallo.']
    };
    var estado = new URLSearchParams(location.search).get('estado');
    var m = MENSAJES[estado];
    if (!m) return;
    document.getElementById('boletinTitulo').textContent = m[0];
    document.getElementById('boletinTexto').textContent = m[1];
    document.getElementById('boletinOtraVez').hidden = !m[2];
    document.title = m[0] + ' · BecaMax';
  })();
</script>
</body>
</html>
