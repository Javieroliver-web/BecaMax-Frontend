name: Tests

# Guardas de la revisión legal (cookies solo con consentimiento). Solo Node,
# sin dependencias. Gratis dentro de los minutos incluidos de GitHub Actions.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
